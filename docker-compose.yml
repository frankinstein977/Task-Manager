services:
  postgres:
    image: postgres:16-alpine
    container_name: todo-tasks-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_tasks
    ports:
      - "5432:5432"
    volumes:
      - todo_tasks_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_tasks"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  todo_tasks_data:
